services:
  rating-service:
    build:
      context: backend
      dockerfile: deploy/docker/rating/Dockerfile
    restart: on-failure
    environment:
      PORT: "8050"
      DATABASE_URL: postgres://program:test@postgres:5432/ratings?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RATING_PORT:-8050}:8050"

  library-service:
    build:
      context: backend
      dockerfile: deploy/docker/library/Dockerfile
    restart: on-failure
    environment:
      PORT: "8060"
      DATABASE_URL: postgres://program:test@postgres:5432/libraries?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LIBRARY_PORT:-8060}:8060"

  postgres:
    image: library/postgres:13
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U program -d libraries"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
